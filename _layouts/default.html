<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site.title }}</title>
    <link rel="preload" as="video/mp4" href="/assets/intro.mp4" type="video/mp4">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="logo">
                <a href="/">Green Stag</a>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a></li>
                    <li><a href="/about" {% if page.url == "/about" %}class="active"{% endif %}>About</a></li>
                    <li><a href="/philosophy" {% if page.url == "/philosophy" %}class="active"{% endif %}>Philosophy</a></li>
                    <li><a href="/approach" {% if page.url == "/approach" %}class="active"{% endif %}>Approach</a></li>
                    <li><a href="/contact" {% if page.url == "/contact" %}class="active"{% endif %}>Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ 'now' | date: "%Y" }} Greenstag. All rights reserved.</p>
            <div class="social-links">
                <a href="https://github.com/greenstag-im" target="_blank">GitHub</a>
            </div>
        </div>
    </footer>
</body>
</html>
